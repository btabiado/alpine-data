name: lthcs-crypto-daily

# Daily LTHCS crypto history accumulation. Runs scripts/lthcs_crypto_daily.py
# once per day, commits the resulting data/lthcs/snapshots_crypto/ artifacts,
# and pushes back to main so pages.yml picks them up on its next hourly build.
# Distinct concurrency group from pages.yml / lthcs-daily so the workflows
# don't block each other.
#
# Schedule rationale: 22:00 UTC = ~17:00 ET. One hour before the equity
# 23:00 UTC run (lthcs-daily.yml), so any downstream consumer that reads
# both equity and crypto on the same day sees fresh crypto data first.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

# Push back to main requires contents:write. Pages deployment lives in
# pages.yml — we intentionally do NOT request pages:write here so the
# workflows can't race over the gh-pages artifact.
permissions:
  contents: write

# Per-ref group so two pushes to main don't queue forever, but
# cancel-in-progress is false so a manually-triggered run in the middle
# of the cron run still queues (vs. being killed mid-write).
concurrency:
  group: lthcs-crypto-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so the push back to main has a complete refspec.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LTHCS crypto daily pipeline
        # NO `env:` KEY BLOCK, AND THAT IS THE FIX, NOT AN OMISSION.
        #
        # This step used to hand the job three secrets — COINGECKO_API_KEY,
        # CRYPTOCOMPARE_API_KEY and GLASSNODE_API_KEY — described in a comment
        # as lifting CoinGecko's rate limit and reserving an on-chain upgrade
        # path. An audit of the actual code found that this pipeline reads NONE
        # of them. `scripts/lthcs_crypto_daily.py` and everything it imports
        # touch exactly one environment variable, LTHCS_CACHE_DIR, and
        # `lthcs/sources/crypto_data.py::fetch_coingecko_markets` builds its URL
        # with no key parameter and sends no auth header, so the rate limit the
        # key was supposedly lifting has been binding this whole time. Every
        # spelling was grepped: x-cg-, x_cg_, cg_demo, cg_pro, CG_API. Nothing.
        #
        # A secret passed to code that cannot read it is worse than no secret:
        # it reads as working plumbing in the workflow, in the audit report and
        # to anyone debugging a throttled run, and it is none of those things.
        # So it is removed rather than left in place looking functional.
        #
        # WHY REMOVE RATHER THAN WIRE IT UP. Wiring is the better fix only when
        # there is something to gain, and here there is not much: this job pulls
        # one /coins/markets page for three assets, once a day, against a free
        # tier that allows ~30 calls a minute. The throttle is not what is
        # limiting this pipeline and never was. Wiring it also means editing
        # lthcs/sources/crypto_data.py (thread a `headers` argument through
        # _http_get/_cached_json and send `x-cg-demo-api-key`), which is a
        # different file with different owners and different tests — a change
        # worth making deliberately, if the call volume ever grows, and not
        # worth smuggling in as a side effect of an honesty pass.
        #
        # If that day comes: add the header in crypto_data.py FIRST, then
        # re-add COINGECKO_API_KEY here, then flip its row in
        # scripts/check_secrets_present.py back from "(retired…)" to
        # "lthcs-crypto-daily". The audit test enforces that ordering.
        #
        # --force: re-running on a date that already has a snapshot is OK
        # (e.g. a manually dispatched run on the same UTC date as the cron).
        run: python scripts/lthcs_crypto_daily.py --force --verbose

      - name: Commit data changes via signed API commit
        # Switched from plain `git push` to API-based commit so the
        # resulting commit is auto-signed by GitHub (Verified badge).
        # See .github/scripts/api-commit.sh for race-safety details.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: lthcs-bot
          AUTHOR_EMAIL: lthcs-bot@users.noreply.github.com
        run: |
          # Stage ONLY the crypto snapshot directory and the per-ticker
          # history files the crypto runner appends to. We do NOT
          # `git add -A` — that would catch any incidental .cache/ or
          # editor artifact in the runner workspace.
          git add data/lthcs/snapshots_crypto/
          git add data/lthcs/history/ || true
          # [skip ci] prevents pages.yml from triggering its own rebuild
          # on every snapshot push (it catches up on the next hourly cron
          # anyway).
          .github/scripts/api-commit.sh \
            "lthcs/crypto: daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
