name: lthcs-crypto-daily

# Daily LTHCS crypto history accumulation. Runs scripts/lthcs_crypto_daily.py
# once per day, commits the resulting data/lthcs/snapshots_crypto/ artifacts,
# and pushes back to main so pages.yml picks them up on its next hourly build.
# Distinct concurrency group from pages.yml / lthcs-daily so the workflows
# don't block each other.
#
# Schedule rationale: 12:00 UTC, as far from midnight as the day allows.
# The snapshot is named by the runner's UTC date, and GitHub starts this cron
# 2-8 hours late. At the old 22:00 slot that put every run on one side of
# midnight or the other: two consecutive runs that landed 23:5x and 00:1x
# wrote the same day's file twice (the second overwriting the first) and left
# the day between them with NO snapshot. That is how 2026-09-14, 09-16, 09-21
# and 09-23 were lost (health/known_gaps.json). Crypto trades around the
# clock, so the hour carries no meaning beyond the date it lands on; at 12:00
# a delay of up to 12 hours still lands on the right day. It still runs well
# before the equity lthcs-daily build, which reads these snapshots.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

# Push back to main requires contents:write. Pages deployment lives in
# pages.yml — we intentionally do NOT request pages:write here so the
# workflows can't race over the gh-pages artifact.
permissions:
  contents: write

# Per-ref group so two pushes to main don't queue forever, but
# cancel-in-progress is false so a manually-triggered run in the middle
# of the cron run still queues (vs. being killed mid-write).
concurrency:
  group: lthcs-crypto-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the push back to main has a complete refspec.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LTHCS crypto daily pipeline
        # This step used to hand the job three secrets — COINGECKO_API_KEY,
        # CRYPTOCOMPARE_API_KEY and GLASSNODE_API_KEY. An audit found the
        # pipeline read NONE of them: a secret passed to code that cannot read
        # it is worse than no secret, because it reads as working plumbing in
        # the workflow, in the audit report, and to anyone debugging a throttled
        # run. All three were removed, with the ordering for restoring one
        # written down: add the header in crypto_data.py FIRST, then re-add the
        # secret here, then fix its row in check_secrets_present.py.
        #
        # COINGECKO_API_KEY has since completed that sequence.
        # lthcs/sources/crypto_data.py now reads it and sends x-cg-demo-api-key
        # (host-matched, so the credential never rides along to a host that did
        # not issue it), so it is restored here — the key now has a reader, and
        # withholding it would put the pipeline back on the keyless ~30 req/min
        # limit the key exists to lift.
        #
        # CRYPTOCOMPARE_API_KEY and GLASSNODE_API_KEY are deliberately still
        # absent: verified against this branch, nothing under lthcs/ or in
        # scripts/lthcs_crypto_daily.py reads either name. Do not re-add them
        # until a reader exists, for the same reason they were removed.
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        # --force: re-running on a date that already has a snapshot is OK
        # (e.g. a manually dispatched run on the same UTC date as the cron).
        run: python scripts/lthcs_crypto_daily.py --force --verbose

      - name: Commit data changes via signed API commit
        # Switched from plain `git push` to API-based commit so the
        # resulting commit is auto-signed by GitHub (Verified badge).
        # See .github/scripts/api-commit.sh for race-safety details.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: lthcs-bot
          AUTHOR_EMAIL: lthcs-bot@users.noreply.github.com
        run: |
          # Stage ONLY the crypto snapshot directory and the per-ticker
          # history files the crypto runner appends to. We do NOT
          # `git add -A` — that would catch any incidental .cache/ or
          # editor artifact in the runner workspace.
          git add data/lthcs/snapshots_crypto/
          git add data/lthcs/history/ || true
          # [skip ci] prevents pages.yml from triggering its own rebuild
          # on every snapshot push (it catches up on the next hourly cron
          # anyway).
          .github/scripts/api-commit.sh \
            "lthcs/crypto: daily snapshot $(date -u +%Y-%m-%d) [skip ci]"
