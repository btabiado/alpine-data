name: trufflehog-weekly

on:
  schedule:
    - cron: "0 3 * * 0"   # Sunday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trufflehog-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # A full-history scan grows with the repo, and this job had no bound at all,
    # so a hung scan would have held a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Trufflehog scan
        id: scan
        # SHA-pinned for supply-chain safety. The action wrapper embeds the
        # scanner binary version, so this freezes both. Refresh quarterly.
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          # NO --since-commit here. The action supplies its own, so passing one
          # in extra_args made trufflehog abort before scanning anything:
          #
          #   trufflehog: error: flag 'since-commit' cannot be repeated
          #
          # That is not a warning — it is exit 1 before a single commit is read.
          # Every run since 2026-06-07 died on it, so this repo has had ZERO
          # effective secret scans for ~13 weeks while the workflow reported a
          # red X that read like a finding rather than a config error.
          #
          # Dropping the flag is also the right scope, not just the compiling
          # one. HEAD~200 was meant to bound the work, but this repo commits
          # automated data snapshots constantly — 161 commits in the last 7 days,
          # 959 in the last 30 — so HEAD~200 reaches back only ~8 days. On a
          # WEEKLY cron that window is barely one period wide and silently
          # misses everything in any busier week. A weekly audit over a
          # fetch-depth: 0 checkout should read the whole history; the
          # timeout-minutes above is the bound instead.
          extra_args: --only-verified
      - name: Summarize result
        if: always()
        run: |
          if [ "${{ steps.scan.outcome }}" = "success" ]; then
            echo "Trufflehog: no verified secrets found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Trufflehog: verified secret(s) found - see scan step" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
