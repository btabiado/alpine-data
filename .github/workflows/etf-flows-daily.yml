name: etf-flows-daily

# Daily refresh for the CRYPTO spot-ETF flow CSVs (data/btc_flows.csv,
# data/eth_flows.csv) that drive the ETF Flows tab.
#
# WHY THIS DID NOT EXIST BEFORE (and why the tab went 82 days stale):
# money-flow-daily.yml refreshes data/equity_etf_flows.csv — the *equity*
# index ETFs (SPY/QQQ/DIA). Nothing refreshed the crypto ones. They were
# updated by hand, by pasting a Farside table into parse_farside.py, and the
# last paste was 2026-05-12. The keyless mirror wired into fetch_live.py is
# not a substitute: it is abandoned (last row 2025-05-02, a year older than
# the committed data) and Total-only, so it would both regress the dates and
# destroy the per-fund columns.
#
# So we fetch the canonical free source (Farside Investors) from a GitHub
# Actions runner. That is the same clean-egress pattern cfpb-daily.yml and
# usaspending-daily.yml already use for upstreams that block datacenter IPs.
#
# The fetcher REFUSES to write a partial or regressing parse (see
# scripts/fetch_etf_flows.py) — on any doubt it preserves the existing CSV and
# exits non-zero, so a Farside markup change turns this workflow red instead
# of silently shredding history. That red is the point: the whole reason these
# feeds rotted for three months is that every failure in this repo was silent.
# A non-zero exit also emits a ::error annotation naming the asset, the check,
# and the dates or HTTP status, so the run page is not only "exit code 1".
#
# A few settled rows where one fund is '-' are not that failure (daily audit
# 2026-10-16, Top Issue 1: ETH had 6, BTC had 3, and a cap of 5 failed ETH).
# Those rows keep the Total already committed, the step warns, and new rows
# are still appended. '-' on more than 10% of settled rows is still a refused
# write: that is the convention-change signal, not the absolute count.
#
# HTTP 403 is not that failure. Farside has been refusing GitHub runners since
# 2026-10-06 (daily audit 2026-10-15: both CSVs stuck at 2026-10-05, this step
# red). The job does not try to get around the block. It logs the 403, then
# merges, in order, TFTC's public CC BY 4.0 bitcoin series (no key; ETH has no
# equivalent) and data/etf_flows_manual.json plus the manual_entry input below.
# When every source is blocked and nothing new was merged, the step warns and
# exits 0. The CSVs stay where they are, so data health keeps reporting them
# stale — that is the alarm. A bad parse or a malformed override still fails.
#
# HTTP 5xx (including Cloudflare 521) and timeouts are not that failure while
# the CSV is still fresh. The fetch retries them with backoff, on the same
# User-Agent, with no proxy. If they still fail and nothing new was merged,
# the step emits a soft warning ("ETF flows delayed") and exits 0 while the
# newest reported session is less than 2 trading days old. The daily audit
# grades that warning as a notice, not a failed workflow. Once two or more
# sessions are already due and missing, the step fails as before.
#
# Commit carries [skip ci] so the push doesn't retrigger pages.yml's push
# build; pages.yml's own hourly cron picks up the new CSVs on its next tick.

on:
  schedule:
    # 09:15 UTC. Farside posts the prior US trading day's flows overnight ET;
    # this also lands after money-flow-daily (08:30 UTC) so the two ETF-flow
    # jobs don't race each other's commits.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      manual_entry:
        description: "Optional flows to merge (JSON {btc,eth} or CSV with an asset column). Blank cells are unreported, never 0. See README."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: etf-flows-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Fetch BTC + ETH spot-ETF flows
        # Pure-stdlib fetcher — no pip install. A refused parse or a malformed
        # override fails the step. HTTP 403 from every source warns and exits 0;
        # staleness stays visible on the CSVs themselves. 5xx and timeouts retry
        # with backoff (same User-Agent, no proxy) and, if still failing, warn
        # and exit 0 while the CSV is under 2 trading days old.
        env:
          ETF_FLOWS_MANUAL: ${{ inputs.manual_entry }}
        run: python scripts/fetch_etf_flows.py

      - name: Commit data changes via signed API commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: etf-flows-bot
          AUTHOR_EMAIL: etf-flows-bot@users.noreply.github.com
        run: |
          git add data/btc_flows.csv data/eth_flows.csv
          .github/scripts/api-commit.sh \
            "etf-flows: daily refresh $(date -u +%Y-%m-%d) [skip ci]"
