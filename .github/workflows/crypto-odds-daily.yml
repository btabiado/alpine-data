name: crypto-odds-daily

# Daily refresh for /crypto-odds/ (option-implied settlement odds for BTC, ETH, XRP).
# crypto_odds/build_odds.py snapshots Deribit's public option chains, fits the market-implied
# curves with the vendored research engine (crypto_odds/engine), and rewrites crypto_odds/odds.json.
# If no chain is usable it exits non-zero and the last-good odds.json stays in place.
#
# crypto_odds/build_outlook.py then runs the research models on fresh spot closes for the 30-day outlook
# (outlook.json) and logs each day's calls for grading (outlook_history.json).
#
# 14:15 UTC, offset from the other data bots (06:13, 07:29, 08:30). [skip ci] keeps the push from
# retriggering pages.yml; its hourly cron publishes the new odds.json.
on:
  schedule:
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-odds-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned, matching the repo's other Python jobs
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # scipy 1.18+ (crypto_odds/requirements.txt) ships wheels only for
        # Python >= 3.12. On 3.11 this step died with
        # "No matching distribution found for scipy==1.18.1"
        # (crypto-odds-daily run 39052317800, 2026-10-17).
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install engine dependencies
        run: pip install -r crypto_odds/requirements.txt

      - name: Build odds.json from live Deribit chains
        timeout-minutes: 8
        run: python crypto_odds/build_odds.py

      - name: Build the 30-day outlook from fresh spot prices
        # A failure keeps the last-good outlook.json; the odds still publish.
        continue-on-error: true
        timeout-minutes: 6
        run: python crypto_odds/build_outlook.py

      - name: Render the one-page PDFs for the Download PDF menu (all assets, BTC, ETH, XRP)
        # Chrome is preinstalled on ubuntu-24.04 runners. A render failure keeps yesterday's PDF.
        continue-on-error: true
        run: |
          .github/scripts/render_print_pdf.sh crypto_odds "$PWD/crypto_odds/crypto-odds.pdf"
          for a in BTC ETH XRP; do
            .github/scripts/render_print_pdf.sh crypto_odds "$PWD/crypto_odds/crypto-odds-$a.pdf" "asset=$a"
          done

      - name: Commit odds snapshot via signed API commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: crypto-odds-bot
          AUTHOR_EMAIL: crypto-odds-bot@users.noreply.github.com
        run: |
          git add crypto_odds/odds.json crypto_odds/outlook.json crypto_odds/outlook_history.json crypto_odds/crypto-odds*.pdf
          .github/scripts/api-commit.sh \
            "crypto-odds: option-implied odds snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
