name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        # Runtime + test-only packages; the pipeline jobs install only the
        # first file.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build the static dashboard.html (before pytest)
        env:
          # The State Dept advisory page answers this runner with HTTP 403
          # (Cloudflare "Just a moment..."). Daily audit 2026-10-15 counted
          # tests.yml run 38662092966, where both Python jobs hit that page
          # live and the scraper rebuilt advisories from RSS. This build
          # must not open a socket to travel.state.gov or cadataapi.state.gov:
          # the env var serves offline fixtures (HTML 403, empty CA API list,
          # RSS sample) so the RSS fallback path runs as a warning and cannot
          # fail the job. pages.yml does not set it and still fetches live.
          # pytest does not need the env var: tests monkeypatch the fetch, and
          # conftest refuses any other outbound socket.
          ALPINE_ADVISORIES_MOCK: "1"
        run: |
          # Aggregator should produce a working dashboard.html from a
          # minimal one-row CSV (proves the full read -> aggregate -> render
          # pipeline works end-to-end in CI). This MUST run BEFORE pytest so
          # the blank-tab integrity test (which reads the built dashboard.html)
          # actually executes instead of silently skipping on a missing file.
          mkdir -p data
          printf 'date,Total\n2024-01-11,100\n' > data/btc_flows.csv
          printf 'date,Total\n2024-07-23,50\n' > data/eth_flows.csv
          python app.py --no-open
          test -f dashboard.html
          echo "dashboard.html generated ($(wc -c < dashboard.html) bytes)"

      - name: Validate V1 dashboard JS structure
        # Run the same structural gate that guards the deploy (pages.yml) on
        # every PR, right after the build, so a tab-routing / sidecar-coverage
        # regression is caught here too.
        run: python tools/validate_dashboard.py dashboard.html

      - name: Run pytest
        env:
          # Hard-fail flag wired up by the validators/tests lane: with the
          # build now guaranteed to run first, a missing dashboard.html can no
          # longer silently skip the blank-tab integrity test.
          REQUIRE_DASHBOARD: "1"
        run: |
          python -m pytest tests/ -v --tb=short
