name: lthcs-trends-daily

# Daily Google Trends nudge for the LTHCS Adoption pillar — Phase 2 of
# Tier 2 #14. The weekly batch (lthcs-trends-weekly.yml) only reaches
# ~11 tickers before pytrends 429s us; this daily cron spreads the work
# out (~30 tickers/day). At the 515-ticker universe a full pass takes
# about 17 days, not the 5-6 days it took at 167.
#
# Runs at 04:13 UTC. It used to fire at 04:00, the same minute as the weekly
# Monday batch, so on Mondays two jobs scraped Google Trends at once and
# rewrote the same data/lthcs/trends/<ISO-week>.json. The weekly batch now
# starts at 02:47 on Mondays and both jobs share one concurrency group, so
# they never overlap: whichever starts second waits, then checks out the
# other's commit. (Off-minute times also dodge the top-of-hour cron rush.)
#
# pytrends is an unofficial scraper with no release since 2023-04; when
# Google changes the endpoint this job fails until it is replaced.
# pytrends has no API key; the script's AdaptiveSleeper handles backoff
# (12s base, 2x on 429 capped at 300s, reset on success) and a
# 5-consecutive-429 circuit breaker ships partial progress for tomorrow.
#
# Writes additively to data/lthcs/trends/<ISO-week>.json (preserves
# Phase 1's weekly fetches) and commits back to main so the next
# pages.yml deploy picks the new data up.
on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Override default batch size (default: 30 tickers/day)"
        required: false
        default: "30"
      force:
        description: "Ignore the 5-day stale-cache TTL"
        required: false
        default: "false"

permissions:
  contents: write

# Same concurrency group as lthcs-trends-weekly.yml: both rewrite the same
# ISO-week file, and each commits the copy it checked out plus its own
# additions, so overlapping runs would drop each other's rows.
# cancel-in-progress: false lets a run queue behind the other instead of
# stomping it.
concurrency:
  group: lthcs-trends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily Google Trends nudge
        # The script handles its own backoff + retry + resume from
        # .cache/lthcs/trends_progress.json. Exit non-zero on hard fail
        # so the run is visible in the Actions UI; soft-bail on
        # consecutive 429s exits 0 (ship-what-we-have).
        run: |
          python scripts/lthcs_trends_daily.py \
            --batch-size "${{ github.event.inputs.batch_size || '30' }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit data changes via signed API commit
        # Switched from plain `git push` to API-based commit so the
        # resulting commit is auto-signed by GitHub (Verified badge).
        # See .github/scripts/api-commit.sh for race-safety details.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: lthcs-bot
          AUTHOR_EMAIL: lthcs-bot@users.noreply.github.com
        run: |
          git add data/lthcs/trends/
          .github/scripts/api-commit.sh \
            "lthcs: daily trends nudge $(date -u +%Y-%m-%d) [skip ci]"
