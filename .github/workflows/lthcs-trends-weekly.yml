name: lthcs-trends-weekly

# Weekly Google Trends batch for the LTHCS Adoption pillar. pytrends is
# keyless but heavily rate-limited; running on Monday 02:47 UTC
# (= Sunday 22:47 ET) gives Google's limiter the weekend to cool down
# and avoids fighting the daily 23:00 UTC cron. It used to start at 04:00,
# the same minute as lthcs-trends-daily.yml; that job now starts at 04:13
# and shares this concurrency group, so the two never scrape at once.
#
# pytrends is an unofficial scraper with no release since 2023-04; when
# Google changes the endpoint this job fails until it is replaced.
#
# Writes weekly snapshots to data/lthcs/trends/<ISO-week>.json and
# commits them back to main so the next daily/pages build picks them up.
on:
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with lthcs-trends-daily.yml (both rewrite the same ISO-week file)
# and distinct from lthcs-daily; cancel-in-progress: false lets a queued
# run wait instead of stomping the running one.
concurrency:
  group: lthcs-trends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly Google Trends batch
        # pytrends is keyless. The script handles its own retries +
        # backoff; if Google still blocks us, exit non-zero so the run
        # is visible in the Actions UI rather than silently no-op'ing.
        run: python scripts/lthcs_trends_weekly.py

      - name: Commit data changes via signed API commit
        # Switched from plain `git push` to API-based commit so the
        # resulting commit is auto-signed by GitHub (Verified badge).
        # See .github/scripts/api-commit.sh for race-safety details.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: lthcs-bot
          AUTHOR_EMAIL: lthcs-bot@users.noreply.github.com
        run: |
          git add data/lthcs/trends/
          .github/scripts/api-commit.sh \
            "lthcs: weekly trends $(date -u +%Y-%m-%d) [skip ci]"
