name: cron-watchdog

# Catch up scheduled workflows that GitHub dropped or started hours late.
#
# Alpine Data daily audit 2026-10-18: aviation-opensky, lthcs-news-hourly and
# pages each ran about 20% of their hourly ticks, and most daily crons
# started 4–9 hours late. Data still updated, with gaps.
#
# GitHub's rule (triggering a workflow from a workflow): events caused by
# GITHUB_TOKEN do not create new workflow runs, EXCEPT workflow_dispatch and
# repository_dispatch, which always do. This job uses that exception. It
# needs no PAT, no cron-job.org, and no new secret — only the built-in
# GITHUB_TOKEN with actions: write, which is the permission the workflow
# dispatch API requires.
#
# The watchdog's own schedule can be dropped the same way, so it is triggered
# two ways:
#   1. Four times an hour, at minutes 12, 27, 42 and 57. Those are off minute
#      0 (the congested window) and off the minutes the watched jobs use, so
#      one dropped tick is not the only chance that hour. A 2-hour freshness
#      gap is then seen within about 15 minutes of crossing it.
#   2. workflow_run when any watched data workflow completes on main. Those
#      jobs do run (dailies land late; hourlies land some of the time). One
#      of them landing rechecks the others. A catch-up this job dispatched
#      with GITHUB_TOKEN does not itself fire workflow_run, so catch-ups do
#      not loop.
#
# Disable without editing the file: set the repository variable
# CRON_WATCHDOG_DISABLED to true (Settings → Secrets and variables → Actions
# → Variables). The job still runs, writes "disabled" to the step summary,
# and does not call the API. A manual run can set dry_run to log the
# decisions without dispatching.
#
# Targets and thresholds live in scripts/cron_watchdog.py. Hourly jobs are
# caught up when the last success is at least 2 hours old. Daily jobs are
# caught up 90 minutes after their cron time if that tick produced no run.
# Anything queued or in progress is left alone; target concurrency groups
# keep a catch-up from stacking on a scheduled run GitHub delivers as well.

on:
  schedule:
    # Off :00, and off the minutes the watched workflows already use.
    # Spread across the hour so a single dropped tick still leaves three.
    - cron: "12 * * * *"
    - cron: "27 * * * *"
    - cron: "42 * * * *"
    - cron: "57 * * * *"
  workflow_run:
    # Names (the `name:` key), in the same order as WATCHES in
    # scripts/cron_watchdog.py. Not this workflow: a scheduled run of the
    # watchdog must not retrigger itself.
    workflows:
      - aviation-opensky
      - lthcs-news-hourly
      - pages
      - aviation-tsa
      - cfpb-daily
      - city-daily
      - crypto-odds-daily
      - daily-audit
      - data-health
      - etf-flows-daily
      - lthcs-backtest-daily
      - lthcs-crypto-daily
      - lthcs-daily
      - lthcs-trends-daily
      - money-flow-daily
      - real-estate-daily
      - usaspending-daily
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log overdue workflows and do not dispatch"
        required: false
        default: false
        type: boolean

permissions:
  contents: read    # checkout the script
  actions: write    # list runs and create workflow_dispatch events

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Catch up overdue workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Always the default branch. A manual run from another branch must
          # not dispatch that branch's copy of a data workflow.
          CRON_WATCHDOG_REF: ${{ github.event.repository.default_branch }}
          CRON_WATCHDOG_DISABLED: ${{ vars.CRON_WATCHDOG_DISABLED || 'false' }}
          CRON_WATCHDOG_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: python scripts/cron_watchdog.py
