name: pages

on:
  push:
    branches: [main]
  schedule:
    # Hourly live-data refresh. GitHub cron is best-effort and can drift
    # 5–15 min under fleet load. Frequent enough to feel fresh, conservative
    # on free-tier rate limits (CoinGecko Demo: 30/min and ~10k/month — the
    # top-50 daily series are cached per UTC day so only the first run of a
    # day spends those calls; see fetch_market.fetch_top_daily_series).
    - cron: "0 * * * *"
  workflow_dispatch: {}
  # Publish the daily audit report as soon as it is committed. daily-audit.yml
  # commits audit/daily/latest.{md,json} through api-commit.sh with the
  # workflow GITHUB_TOKEN, and a commit made with GITHUB_TOKEN never fires
  # `push` (it is also [skip ci]), so the report only reached the site on the
  # next scheduled run here. That "hourly" cron in practice fires a few times a
  # day: on 2026-10-05 the first report landed at 18:29Z, the last deploy had
  # run at 18:14Z, and /audit/latest.md stayed 404 for 5+ hours afterwards.
  # workflow_run runs this file from main at main's newest commit (never the
  # triggering run's code), so it builds exactly what a push to main would.
  workflow_run:
    workflows: [daily-audit]
    types: [completed]
    branches: [main]

permissions:
  # `write` (was `read`) so the composite-index snapshot can be committed back
  # and actually accumulate into a time series. Nothing else in this workflow
  # writes to the repo.
  contents: write
  pages: write
  id-token: write
  actions: read   # build_backfill_jobs.py reads r2-backfill workflow run history; publish_github_status.py reads every workflow's runs and jobs
  # Read-only, for scripts/publish_github_status.py (/health/github_status.json):
  checks: read            # failed jobs' annotations + open PRs' head check runs
  pull-requests: read     # open PRs
  issues: read            # open issues
  security-events: read   # open code-scanning alerts

concurrency:
  # Renamed from "pages" to escape a wedged run in the OLD group: run 844
  # (2026-08-18T15:37Z) sat status=queued for days still holding "pages", and
  # because cancel-in-progress was false every subsequent hourly run queued
  # behind it and was superseded -> cancelled with zero jobs. Net effect: no
  # deploy at all for 3+ days while the data crons kept committing happily.
  # A new group name abandons that stuck slot without needing actions:write.
  group: pages-deploy
  # Newest-wins. This job republishes the whole site from committed data, so a
  # superseded run loses nothing -- the next run redoes it. Crucially it also
  # means a future stuck run can no longer wedge the pipeline indefinitely.
  # Safe for the commit-back: api-commit.sh publishes via a final PATCH of the
  # ref, so interrupting before it writes nothing and after it the commit has
  # already landed; orphaned blobs/trees are unreferenced and get GC'd.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore fetched data cache (markets_top stale-keep, etc.)
        # CI runs are stateless — every fetch starts cold. fetch_market.py's
        # stale-keep fallback (markets_top, lunarcrush) reads from prior
        # data/market.json, which doesn't exist on a fresh runner. This
        # cache lets the stale-keep actually work in CI by persisting the
        # most recent successful fetch between runs. Primary key uses
        # run_id so we always save a fresh snapshot; restore-keys prefix
        # gets the latest available on miss.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/market.json
            data/whale.json
            data/.stale/
            snowflake_summit/.enrich_cache.json
            data-opensky-positions.json
          key: fetched-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fetched-data-

      - name: Seed ETF flow CSV stubs (only if real CSVs not committed)
        run: |
          # If data/btc_flows.csv + data/eth_flows.csv are committed to the
          # repo (force-add overrides .gitignore), this step is a no-op.
          # Otherwise we seed one-row stubs to keep the ETF Flows tab from
          # crashing — useful before the user ships real Farside data.
          mkdir -p data
          if [ ! -f data/btc_flows.csv ]; then
            printf 'date,Total\n2024-01-11,100\n' > data/btc_flows.csv
          fi
          if [ ! -f data/eth_flows.csv ]; then
            printf 'date,Total\n2024-07-23,50\n' > data/eth_flows.csv
          fi

      - name: Fetch live data + generate dashboard.html
        timeout-minutes: 8   # heaviest network step — cap it so a hung upstream can't stall the deploy
        # app.py runs fetch_market.fetch_all() then renders dashboard.html
        # in one invocation. fetch_all handles per-source failures internally
        # (logs "[skip] <url>" and continues); app.py wraps the call in
        # try/except so the generator always runs even on a total fetch
        # crash, falling back to whatever data is on disk.
        env:
          # Optional API keys. If a secret isn't set in the repo, the env
          # var resolves to an empty string and the source falls back to
          # {available: False} or a free alternative. Add them under
          # repo Settings → Secrets and variables → Actions → New repository
          # secret to light up the corresponding sections on the public mirror:
          #   FRED            macro overlay (DXY/SPX/Gold/10Y/M2)
          #   GLASSNODE       true BTC whale-cohort metrics (replaces bitinfocharts)
          #   (CRYPTOCOMPARE_API_KEY is no longer mapped: since 2026-10 every
          #   CryptoCompare/CoinDesk dependency was replaced with free sources
          #   — CoinGecko, Coinbase/Kraken/Binance.US candles, Google News RSS,
          #   GitHub REST — and nothing reads that variable any more.)
          #   GITHUB_TOKEN    the job's own token, sent ONLY to api.github.com
          #                   for the Research tab's repository stats (keyless
          #                   works too, at 60 requests/hour per runner IP).
          #   REDDIT_*        subreddit subscriber counts (cloud IPs are normally
          #                   blocked; OAuth bypasses that)
          #   COINMETRICS     ETH whale active addresses / tx count / transfer
          #                   volume / supply on the Whale-tab ETH panel
          #   ETHERSCAN       90-day ETH blocks-per-day chart on the Whale-tab
          #                   ETH panel (free tier — synthesized from
          #                   getblocknobytime since dailytx is Pro-only)
          #   COINGECKO       raises the CoinGecko limit from ~30 req/min to
          #                   ~500. This one is NOT cosmetic: keyless, the
          #                   top-50 sweep in fetch_trading 429s routinely,
          #                   and a 429 returns [] which sends markets_top
          #                   down the stale-keep path. Unset = keyless, which
          #                   still works but re-opens that failure mode.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          COINMETRICS_API_KEY: ${{ secrets.COINMETRICS_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          # SEC fair-access contact UA for the AI-tab Form D sweep (falls back
          # to a generic UA when unset).
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python app.py --fetch-market --no-open

      - name: Fallback generate if dashboard.html missing
        # Safety net: if the previous step crashed before generating,
        # render once more from whatever data exists.
        if: hashFiles('dashboard.html') == ''
        run: python app.py --no-open

      # NOTE: the Stock Flows sidecar (data-stock-money-flow.json) is now written
      # INSIDE the fetch-market step above — fetch_market.fetch_all() calls
      # fetch_stock_money_flow.build_from_signals() off the MFI/CMF already
      # computed during the (working) stocks_signals fetch, with zero extra Yahoo
      # calls. The old standalone fetch here (and the daily cron) got Yahoo-
      # throttled (0/219); both removed. The data-*.json copy step below deploys
      # the sidecar.

      - name: Fetch OpenSky flight positions (deploy-time, never committed)
        # The Aviation tab's Flight Map reads data-opensky-positions.json. It used
        # to be committed by aviation-opensky.yml on every run: 978 versions of a
        # 200 KB single-line file were 46% of all repo history, for data whose only
        # value is the latest snapshot (R2 archives each deploy's copy via
        # upload_to_r2.py). It is now fetched here and staged with the other
        # data-*.json sidecars. One OpenSky /states/all call per deploy.
        #
        # fetch_opensky.py also rewrites data-opensky.json from the same response,
        # so the Live Traffic tile and the map agree. aviation-opensky.yml still
        # commits data-opensky.json (511 B) as the cold-checkout floor.
        #
        # On a failed fetch the previous deploy's file, restored by the cache step
        # above, is staged instead. The map labels it with its own snapshot time,
        # and data_health --mode built flags it if it ages past its limit.
        # Non-fatal: the rest of the site must deploy regardless.
        timeout-minutes: 3
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: >-
          python fetch_opensky.py
          || echo "::warning title=OpenSky positions not refreshed::fetch_opensky.py failed; the Flight Map serves the previous deploy's snapshot if one was cached, otherwise its empty state"
        continue-on-error: true

      - name: Validate V1 dashboard JS structure
        # Structural lint of the freshly-built dashboard.html inline <script>,
        # including the SIDECARS↔SIDECAR_FOR_TAB coverage check that caught
        # the V1 regression on 2026-05-27 (new tabs ported into V1 added
        # entries to SIDECAR_FOR_TAB without corresponding SIDECARS keys, so
        # the lazy loader returned null and tabs sat in their empty state
        # forever). Mirrors the V2 validation step below. Pure-stdlib Python
        # — no new deps. FAILS THE BUILD on regression: production at `/` is
        # the source of truth and we'd rather block a deploy than ship dead
        # tabs.
        if: hashFiles('dashboard.html') != ''
        run: python tools/validate_dashboard.py dashboard.html

      - name: Build dashboard health status JSON
        # Scans data/ + data/.stale/ mtimes to emit data/health/status.json,
        # consumed by /health/ to show per-tab freshness. Pure-stdlib script,
        # no API calls — runs after fetch-market so mtimes reflect this run.
        # Failure must NOT break the deploy: production at `/` is the source
        # of truth; /health/ is observability-only.
        run: python scripts/build_health_status.py || echo "[health] generator failed; continuing"
        continue-on-error: true

      - name: Alert on stale headline feeds
        # /health/ has reported per-feed freshness for a while, but reading it
        # meant opening the page, and nobody did — a frozen crypto feed sat on
        # the front page for 16 days behind a green build. This surfaces the
        # same rows as run annotations, so staleness shows up where failures
        # are already being read.
        #
        # NOT --strict here, and continue-on-error for the same reason the
        # generator above is: production at `/` is the source of truth and a
        # stale feed must not block the deploy of everything else. The
        # annotation is the alarm; the deploy still ships.
        run: python scripts/alert_stale_feeds.py
        continue-on-error: true

      - name: Snapshot composite indexes (daily time series)
        # Persists Whale Sentiment (BTC+ETH), Money Flow Index, Crypto Signal
        # Sentiment and POC breadth to data/composites/<date>.json, mirroring
        # what data/lthcs/index/ already does for LTHCS. Until now every one of
        # these composites was computed at render time and discarded, so the
        # site could show today's number but never how it got there.
        #
        # MUST run here rather than in its own cron: these are derived from
        # data/market.json and data/whale.json, which are cache-restored into
        # this job and never committed, so no other workflow can see them.
        #
        # Idempotent — it only rewrites today's file when an index actually
        # moved, so the hourly schedule doesn't produce 24 no-op commits.
        #
        # No key is read here any more: poc_signal_breadth comes from free
        # sources (CoinGecko + exchange candles) since 2026-10, so a null is a
        # real gap again, not "unavailable by design".
        run: python scripts/snapshot_composites.py || echo "[composites] snapshot failed; continuing"
        continue-on-error: true

      - name: Commit composite-index snapshot
        # The whole point is accumulation, so this one must be committed back.
        # [skip ci] keeps it from retriggering this workflow; the hourly cron
        # picks up any change on its next tick.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR_NAME: composites-bot
          AUTHOR_EMAIL: composites-bot@users.noreply.github.com
        run: |
          if [ -n "$(git status --porcelain data/composites)" ]; then
            git add data/composites
            .github/scripts/api-commit.sh \
              "composites: index snapshot $(date -u +%Y-%m-%d) [skip ci]" \
              || echo "[composites] commit failed; continuing"
          else
            echo "[composites] no change to commit"
          fi
        continue-on-error: true

      - name: Snapshot deploy-time feed history (daily rows)
        # data-stock-money-flow.json and data-travel.json are rebuilt by this
        # job and never committed, and neither upstream serves history, so
        # each build used to throw yesterday's reading away. This appends ONE
        # compact row-set per observation date (scripts/snapshot_history.py):
        #   data/stock_money_flow_history.csv   completed trading-day bars only
        #   data/travel_advisory_levels.csv     one summary row per day
        #   data/travel_advisory_changes.csv    a row only when a level changes
        # Append-only by date, so the hourly schedule re-runs it as a no-op and
        # the commit below fires at most once per new date. ~0.2 MB/year total.
        # Must run here: the sidecars exist only inside this job.
        run: python scripts/snapshot_history.py || echo "[history] snapshot failed; continuing"
        continue-on-error: true

      - name: Commit deploy-time feed history
        # Same signed API commit as data/composites, with [skip ci]. Nothing is
        # staged unless the snapshot above appended a new date, so this is a
        # no-op on every run but the first one after a new observation lands.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="data/stock_money_flow_history.csv data/travel_advisory_levels.csv data/travel_advisory_changes.csv"
          for f in $FILES; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          if git diff --cached --quiet -- $FILES; then
            echo "[history] no new observation date; nothing to commit"
          else
            .github/scripts/api-commit.sh \
              "history: deploy-time feed rows $(date -u +%Y-%m-%d) [skip ci]" \
              || echo "[history] commit failed; continuing"
          fi
        continue-on-error: true

      - name: Probe upstream API reachability (live snapshot)
        # Hits each upstream data-source endpoint and writes
        # data/health/api_status.json — the snapshot the static /health/apis.html
        # page falls back to when there's no live server to probe through.
        # Keyed sources report auth_required (live, gated) when the secret is
        # absent, so this stays useful without every key configured. ~50 cheap
        # requests, stdlib urllib except the TSA probe, which uses `requests`
        # (tsa.gov's edge 403s urllib from Actions). `requests` comes from
        # requirements.txt via "Install dependencies" above; without it that
        # probe falls back to urllib. Must NOT break the deploy.
        #
        # *** THIS ENV BLOCK MUST LIST EVERY key_env api_status.TARGETS NAMES. ***
        # It listed five of fourteen. The other nine — Socrata, Census, BLS,
        # AirNow, FBI CDE, OpenSky, Reddit, CoinGlass, Santiment — were named by
        # the probe but never handed to it, so /health/apis.html reported
        # `key_present=false` for every one of them *even when the repository
        # secret was correctly set*. The page was not describing the user's
        # configuration; it was describing this block, in words that sounded
        # like the user's configuration. That is what "they used to be green,
        # what the hell?" was looking at.
        #
        # Two of the nine were retired rather than wired, because they unlocked
        # nothing (see api_status.py and scripts/check_secrets_present.py). The
        # remaining seven are added below. tests/test_api_status_wiring.py
        # re-derives api_status.KEY_ENVS and fails if this block falls behind
        # again, and api_status.py now reports a key it was never handed as
        # "not wired" rather than "no key" — so the next occurrence is visible
        # on the page instead of silently wrong.
        #
        # A genuinely unset secret resolves to "" here, which is exactly what we
        # want: the variable arrives empty and the probe can honestly say
        # "wired, not configured" instead of guessing.
        env:
          # --- already wired ---
          # (CRYPTOCOMPARE_API_KEY removed 2026-10: no probe names it any more —
          # the CryptoCompare/CoinDesk probes were replaced by the free sources
          # that actually feed the dashboard.)
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          COINMETRICS_API_KEY: ${{ secrets.COINMETRICS_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # --- named by the probe, never passed to it until now (the defect) ---
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          # FBI_CDE_API_KEY is deliberately absent: the FBI CDE probe is
          # keyless (cde.ucr.cjis.gov/LATEST serves its data series without a
          # key), so no probe names it. The wiring test also fails on a key
          # passed here that no probe uses.
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        run: python api_status.py || echo "[api-status] probe failed; continuing"
        continue-on-error: true

      - name: Commit the API status record
        # The authoritative per-API status was written every build, staged to the
        # site, then thrown away with the runner. The only way to read it was to
        # load the deployed page — no `git log`, no diff, no way for the user or
        # any tooling to answer "when did Census start 403ing?" after the fact.
        # Committed back the same way data/composites is: staged, then handed to
        # the signed .github/scripts/api-commit.sh, with [skip ci] so it does not
        # retrigger this workflow.
        #
        # data/health/ is otherwise gitignored; api_status.json is deliberately
        # un-ignored (see the carve-out in .gitignore) because it is a RECORD,
        # not a build cache.
        #
        # THE GUARD. A failed or empty probe must never overwrite a good record
        # with nothing, so the snapshot is parsed and structurally validated
        # before anything is staged: it must be JSON, carry summary.total >= 1,
        # and have a sources array of exactly that length. Note what is
        # deliberately NOT in the guard — "at least one source came back up". A
        # sweep where everything is down is a real record, and the most
        # interesting one there is; suppressing it would be this PR's own bug
        # running in reverse.
        #
        # Plus a churn guard: generated_at moves on every hourly run, so
        # committing on any diff at all would mean 24 no-op commits a day.
        # Commit only when the SUBSTANCE moved (verdict / HTTP status / key
        # wiring / summary), or when the committed record has aged past
        # MAX_RECORD_AGE_H — a heartbeat, so the date in git keeps meaning
        # "when we last checked" rather than "when it last changed".
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_RECORD_AGE_H: "6"
          COMMIT_FLAG: ${{ runner.temp }}/api-status-commit.flag
        run: |
          set -euo pipefail
          rm -f "$COMMIT_FLAG"
          python3 - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone

          PATH = "data/health/api_status.json"
          # Fields that jitter every single run and say nothing new.
          VOLATILE = {"latency_ms", "retries", "note"}

          def substance(snap):
              """What we actually learned, minus per-run jitter. Two snapshots
              with equal substance make identical claims about every upstream,
              so re-committing one is noise."""
              return {
                  "summary": snap.get("summary"),
                  "unwired": snap.get("unwired_key_envs"),
                  "sources": [
                      {k: v for k, v in s.items() if k not in VOLATILE}
                      for s in snap.get("sources", [])
                  ],
              }

          def decide():
              if not os.path.exists(PATH):
                  return None, ("no snapshot on disk (probe skipped or crashed); "
                                "leaving the committed record untouched")
              try:
                  fresh = json.loads(open(PATH, encoding="utf-8").read())
              except (json.JSONDecodeError, OSError, ValueError) as e:
                  return None, (f"snapshot is unreadable ({e}); refusing to "
                                f"overwrite a good record with a broken one")
              total = (fresh.get("summary") or {}).get("total") or 0
              rows = fresh.get("sources") or []
              if total < 1 or len(rows) != total:
                  return None, (f"snapshot is structurally empty "
                                f"(summary.total={total}, sources={len(rows)})")
              # Compare against what is in git, not the working tree — the probe
              # already overwrote the working tree.
              old = subprocess.run(["git", "show", f"HEAD:{PATH}"],
                                   capture_output=True, text=True)
              if old.returncode != 0:
                  return True, "first commit of the record"
              try:
                  prev = json.loads(old.stdout)
              except (json.JSONDecodeError, ValueError):
                  return True, "committed record is unparseable; replacing it"
              if substance(prev) != substance(fresh):
                  return True, "upstream status or key wiring changed"
              try:
                  then = datetime.fromisoformat(
                      str(prev["generated_at"]).replace("Z", "+00:00"))
                  age_h = (datetime.now(timezone.utc) - then).total_seconds() / 3600
              except (KeyError, ValueError, TypeError):
                  age_h = float("inf")
              if age_h >= float(os.environ.get("MAX_RECORD_AGE_H", "6")):
                  return True, f"heartbeat — committed record is {age_h:.1f}h old"
              return None, "nothing moved and the record is recent"

          go, why = decide()
          print(f"[api-status-commit] {'committing' if go else 'skipping'}: {why}")
          # A sentinel file rather than $GITHUB_OUTPUT: outputs are readable by
          # LATER steps, not by the rest of the step that wrote them, so reading
          # one here would silently always be empty.
          if go:
              open(os.environ["COMMIT_FLAG"], "w").write("yes")
          PY
          if [ ! -f "$COMMIT_FLAG" ]; then
            echo "[api-status-commit] nothing staged."
            exit 0
          fi
          # -f because the file lives under an otherwise-ignored directory. The
          # .gitignore carve-out already un-ignores it (and a test asserts that);
          # -f means a future .gitignore edit degrades the record's discoverability
          # rather than silently killing this commit.
          git add -f data/health/api_status.json
          if git diff --cached --quiet -- data/health/api_status.json; then
            echo "[api-status-commit] staged diff is empty; nothing to commit."
            exit 0
          fi
          .github/scripts/api-commit.sh \
            "health: api status record $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" \
            || echo "[api-status-commit] commit failed; continuing"
        continue-on-error: true

      - name: Enrich + rebuild Summit dashboard
        timeout-minutes: 6   # bound the news/Wikidata enrich + rebuild (continue-on-error already set)
        # Pull live vendor news (Google News RSS) + company facts (Wikidata) —
        # both keyless — then rebuild snowflake_summit/dashboard.html so /summit/
        # ships fresh data each deploy. Cached via .enrich_cache.json (restored
        # above) so most runs are cheap; a fetch failure keeps the prior data
        # (stale-keep) and the committed dashboard.html is the final fallback.
        # Non-fatal: production at `/` and `/summit/` must deploy regardless.
        if: hashFiles('snowflake_summit/build.py') != ''
        run: |
          python snowflake_summit/enrich_vendors.py || echo "[summit] enrich failed; using existing data"
          python snowflake_summit/build.py || echo "[summit] rebuild failed; using committed dashboard.html"
        continue-on-error: true

      - name: Commit Summit news feed
        # The enricher above refreshes snowflake_summit/news.json on every
        # deploy, but nothing committed it, so the repo copy (and the
        # data-health monitor that reads it) sat at 2026-06-04 for four months
        # while /summit/ itself moved on. Committed back the same way
        # data/composites is: staged, then handed to the signed api-commit.sh,
        # with [skip ci] so it does not retrigger this workflow.
        #
        # Churn guard: hourly runs add a few headlines each, and committing
        # every one would mean ~24 commits a day. Commit only when the feed's
        # data date (`generated`, the newest item's day) moved, or when the
        # committed copy was gathered more than MAX_FEED_AGE_H ago. The check
        # is also a validity guard: a file that is not JSON with a non-empty
        # items list is never staged over a good one.
        if: github.event_name != 'pull_request' && hashFiles('snowflake_summit/news.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_FEED_AGE_H: "24"
          COMMIT_FLAG: ${{ runner.temp }}/summit-news-commit.flag
        run: |
          set -euo pipefail
          rm -f "$COMMIT_FLAG"
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone

          PATH = "snowflake_summit/news.json"

          def decide():
              try:
                  fresh = json.loads(open(PATH, encoding="utf-8").read())
              except (OSError, ValueError) as e:
                  return False, f"news.json unreadable ({e}); not staging it"
              if not isinstance(fresh, dict) or not fresh.get("items"):
                  return False, "news.json has no items; not staging it"
              old = subprocess.run(["git", "show", f"HEAD:{PATH}"],
                                   capture_output=True, text=True)
              if old.returncode != 0:
                  return True, "first commit of the feed"
              try:
                  prev = json.loads(old.stdout)
              except ValueError:
                  return True, "committed feed is unparseable; replacing it"
              if prev == fresh:
                  return False, "feed unchanged"
              if prev.get("generated") != fresh.get("generated"):
                  return True, (f"feed date moved {prev.get('generated')} -> "
                                f"{fresh.get('generated')}")
              try:
                  then = datetime.fromisoformat(
                      str(prev["gathered_at"]).replace("Z", "+00:00"))
                  age_h = (datetime.now(timezone.utc) - then).total_seconds() / 3600
              except (KeyError, ValueError, TypeError):
                  age_h = float("inf")
              if age_h >= float(os.environ.get("MAX_FEED_AGE_H", "24")):
                  return True, f"committed feed gathered {age_h:.1f}h ago"
              return False, "new headlines only, committed copy is recent"

          go, why = decide()
          print(f"[summit-news] {'committing' if go else 'skipping'}: {why}")
          if go:
              open(os.environ["COMMIT_FLAG"], "w").write("yes")
          PY
          if [ ! -f "$COMMIT_FLAG" ]; then
            exit 0
          fi
          git add snowflake_summit/news.json
          if git diff --cached --quiet -- snowflake_summit/news.json; then
            echo "[summit-news] staged diff is empty; nothing to commit."
            exit 0
          fi
          .github/scripts/api-commit.sh \
            "summit: news feed $(date -u +%Y-%m-%d) [skip ci]" \
            || echo "[summit-news] commit failed; continuing"
        continue-on-error: true

      - name: Rebuild Competitive Landscape dashboard
        # Rebuild landscape/dashboard.html from the committed non_summit_vendors.json
        # + summit overlay so /landscape/ ships fresh. No network — a pure transform
        # of committed data. Non-fatal: the committed dashboard.html is the fallback,
        # and /summit/ + production at `/` must deploy regardless.
        if: hashFiles('landscape/build.py') != ''
        run: |
          python landscape/make_icons.py || echo "[landscape] icon gen failed; using committed icons (if any)"
          python landscape/build.py || echo "[landscape] rebuild failed; using committed dashboard.html"
        continue-on-error: true

      - name: Generate V2 dashboard (parallel build, reads same data/)
        # V2 is a UX-cleanup spin of the same payload — reuses the cached
        # market.json / whale.json / ETF CSVs already fetched above so no
        # extra API calls. Failure here must NOT fail the deploy: production
        # at `/` is the source of truth; V2 at `/v2/` is additive.
        #
        # Env mirrors the V1 fetch step so V2-side fetchers (fetch_cpi.py,
        # fetch_supplies.py for inventory ratio, fetch_metals.py for FRED
        # gold price, future EIA-keyed sources) see the same secrets V1 does.
        # Without this block fetch_cpi sees FRED_API_KEY="" and ships an
        # empty-state payload even when the repo secret is configured —
        # which was exactly the bug on 2026-05-25.
        if: hashFiles('v2/app.py') != ''
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GLASSNODE_API_KEY: ${{ secrets.GLASSNODE_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          COINMETRICS_API_KEY: ${{ secrets.COINMETRICS_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        id: v2build
        # NOTE: deliberately NO `|| echo` here any more. `continue-on-error: true`
        # below already guarantees the deploy proceeds, so the `|| echo` bought
        # nothing — it only forced exit 0, which erased the step's `outcome` and
        # made a broken V2 build indistinguishable from a healthy one. Letting the
        # real exit code through lets the "Report V2 build outcome" step below see
        # `steps.v2build.outcome == 'failure'` and shout about it.
        run: python v2/app.py --no-open
        continue-on-error: true
        # A step timeout catches the HANG case: a V2-side fetcher (FRED/EIA/metals)
        # with no socket timeout can hang on a slow/down API and, with no step cap,
        # stall the ENTIRE Pages deploy (V1 at / and /summit/ included) indefinitely.
        # Bound it so a hung V2 build fails fast and the V1 + Summit publish proceeds
        # (V2 keeps last-good). A kill also registers as outcome == 'failure'.
        timeout-minutes: 6

      - name: Fallback generate V2 if dashboard.html missing
        # Mirror of V1's "Fallback generate if dashboard.html missing" step.
        # If the Generate V2 step above crashed (or was killed mid-fetch) before
        # writing v2/dashboard.html, the staging branch gated on
        # `[ -f v2/dashboard.html ]` would skip V2 entirely and /v2/ would 404
        # for this deploy. Re-run the generator once more — now fast and safe
        # because the committed NUFORC subndx caches mean fetch_mufon only
        # refreshes 2 months, so the heavy backfill no longer dominates the run.
        if: hashFiles('v2/app.py') != '' && hashFiles('v2/dashboard.html') == ''
        id: v2fallback
        run: python v2/app.py --no-open
        continue-on-error: true
        timeout-minutes: 6

      - name: Report V2 build outcome
        # THE ALARM. Both V2 build steps are continue-on-error, which is correct
        # (production at `/` must ship regardless) but means a 6-minute timeout
        # kill or an outright crash both render as a green run. That is precisely
        # how the NUFORC full-backfill regression sat unnoticed while it ate the
        # step budget and starved fetch_stock_prices of its turn.
        #
        # `continue-on-error` sets conclusion=success but leaves outcome=failure,
        # so outcome is the honest signal. This step never fails the job — it only
        # emits a ::warning annotation (visible on the run summary even for
        # soft-failed steps) plus a greppable marker line.
        if: always() && hashFiles('v2/app.py') != ''
        env:
          V2_OUTCOME: ${{ steps.v2build.outcome }}
          V2_FALLBACK_OUTCOME: ${{ steps.v2fallback.outcome }}
        run: |
          set -u
          if [ "${V2_OUTCOME}" = "failure" ] || [ "${V2_FALLBACK_OUTCOME}" = "failure" ]; then
            DETAIL="V2 build did not complete cleanly (build=${V2_OUTCOME}, fallback=${V2_FALLBACK_OUTCOME:-skipped})."
            if [ ! -f v2/dashboard.html ]; then
              DETAIL="${DETAIL} v2/dashboard.html is MISSING — /v2/ will serve the last deployed copy or 404."
            else
              DETAIL="${DETAIL} v2/dashboard.html exists, but sidecars written after the failure point are stale."
            fi
            DETAIL="${DETAIL} Most likely a 6-min timeout kill; check whether fetch_mufon did a full backfill (grep the log for MUFON-DEGRADED)."
            echo "::warning title=V2 build degraded::${DETAIL}"
            echo "[V2-DEGRADED] ${DETAIL}"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "**V2 build degraded** — ${DETAIL}" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "[v2] build completed cleanly (outcome=${V2_OUTCOME})"
          fi
        continue-on-error: true

      - name: Commit NUFORC month cache
        # R1 — the cache must be committed BACK, not just committed once.
        #
        # fetch_mufon walks a ROLLING 144-month window anchored to today, but the
        # tracked data/.stale/nuforc_subndx_*.json snapshot is fixed. Every calendar
        # month, one more in-window month has no cached file and becomes a permanent
        # extra network fetch — silently re-growing the exact backfill that blew this
        # step's timeout, at roughly +1 month/month. Committing the cache back keeps
        # the uncached-in-window set pinned at {today, prior}.
        #
        # api-commit.sh reads the staged index, so newly-cached months round-trip.
        # fetch_mufon deliberately never DELETES an out-of-window month (see the
        # long comment where a prune would otherwise live in fetch_mufon.py):
        # nothing can ever refetch one, so this step should only add files.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Quoted so git (not the shell) expands the pathspec, which is what
          # makes it match newly-written untracked months.
          # `|| true` covers the no-match case, which git treats as an error.
          git add -A -- 'data/.stale/nuforc_subndx_*.json' 2>/dev/null || true
          if [ -n "$(git diff --cached --name-only -- data/.stale)" ]; then
            echo "[nuforc-cache] staging $(git diff --cached --name-only -- data/.stale | wc -l) changed month file(s)"
            .github/scripts/api-commit.sh \
              "nuforc: refresh month cache $(date -u +%Y-%m-%d) [skip ci]" \
              || echo "[nuforc-cache] commit failed; continuing"
          else
            echo "[nuforc-cache] no change to commit"
          fi
        continue-on-error: true

      - name: Validate V2 dashboard JS structure
        # Structural lint of the freshly-built v2/dashboard.html inline
        # <script>. Catches the class of bug that bricked V2 in prod on
        # 2026-05-24 (duplicate `const SIDECAR_FOR_TAB`, plus an `if
        # (state.tab ...)` block accidentally nested inside a `V2.empty({...})`
        # call literal from a take-both conflict resolution). Pure-stdlib
        # Python — no new deps. FAILS THE BUILD on regression: the whole
        # point is to block bad deploys before they ship to /v2/.
        if: hashFiles('v2/dashboard.html') != ''
        run: python tools/validate_v2_dashboard.py

      - name: Judge the built artifacts (data_health --mode built)
        # THE OTHER HALF OF THE WATCHDOG, finally wired.
        #
        # data-health.yml runs `--mode committed` daily: it judges the files a
        # cron commits back. That mode cannot see a BUILT artifact at all,
        # because the committed copy of data-*.json is a placeholder — the real
        # one exists only here, for the ~10 minutes between the fetch step above
        # and the runner being destroyed. `--mode built` judges THOSE.
        #
        # That gap is not hypothetical: the crypto breadth chart sat frozen at
        # 2026-06-09 for three months while fetch_market rewrote its file every
        # single hour. The file's mtime was perpetually fresh; the series inside
        # it was not. Nothing in the committed-mode watchdog could ever have
        # noticed, and nothing did.
        #
        # NON-BLOCKING, AND HERE IS WHY. A stale upstream feed is not a reason to
        # withhold the entire site. If FRED is having a bad morning, the honest
        # response is to ship the dashboard with FRED's panel showing its real
        # age (the whole page is built to do exactly that) — not to serve the
        # previous deploy's HTML and pretend nothing happened, which is strictly
        # more stale and strictly less honest. Blocking here would also make
        # every upstream outage look like a broken build, which is the fastest
        # known way to teach everyone to ignore a red X.
        #
        # So: never fails the job. But it must not be quiet either — a
        # continue-on-error step that prints into the log is the same diary
        # entry nobody reads. It gets all three loud channels: a ::warning
        # annotation per stale feed (these surface on the run summary page even
        # for soft-failed steps), the full report in $GITHUB_STEP_SUMMARY, and a
        # visible soft-failure on the step itself via the real exit code.
        #
        # Evaluated ONCE. data_health.py is run a single time with --report json
        # and both the annotations and the summary are derived from that one
        # verdict — re-running it to build a prettier summary could produce a
        # second, contradicting verdict, which is the failure mode called out in
        # data-health.yml's own comments.
        #
        # No --remediate: remediation re-runs fetchers, and doing that mid-deploy
        # would race the artifacts this very job is about to stage.
        id: builthealth
        run: |
          set +e
          python scripts/data_health.py --mode built --report json > "$RUNNER_TEMP/built-health.json"
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/built-health.json" "$rc" <<'PY'
          import importlib.util, json, os, sys

          path, rc = sys.argv[1], int(sys.argv[2])
          try:
              report = json.loads(open(path, encoding="utf-8").read())
          except (OSError, json.JSONDecodeError, ValueError) as e:
              print(f"::warning title=Built-artifact health check unreadable::"
                    f"data_health --mode built exited {rc} and produced no usable "
                    f"report ({e}). The post-build artifacts went UNJUDGED this "
                    f"run — that is a gap in the monitor, not a clean bill of health.")
              sys.exit(0)

          # Which statuses count as a problem is data_health.py's call, not this
          # step's. Importing the frozenset instead of re-typing it means a new
          # status can never end up silently un-annotated here — the exact way a
          # second monitor starts disagreeing with the first.
          spec = importlib.util.spec_from_file_location(
              "_dh", os.path.join(os.getcwd(), "scripts", "data_health.py"))
          dh = importlib.util.module_from_spec(spec)
          # Registered before exec: @dataclass resolves annotations through
          # sys.modules[cls.__module__] and blows up on an unregistered module.
          sys.modules[spec.name] = dh
          spec.loader.exec_module(dh)

          results = report.get("results", [])
          bad = [r for r in results if r.get("status") in dh.FAILING_STATUSES]
          lines = ["", f"## Built-artifact health (`--mode built`) — "
                       f"{'OK' if not bad else str(len(bad)) + ' feed(s) need attention'}",
                   "",
                   f"Judged {len(results)} feed(s) against the artifacts this build "
                   f"just produced, not against their committed placeholders.", ""]
          if bad:
              lines += ["| Feed | Status | Age | Limit | Owner |", "|---|---|---|---|---|"]
          for r in bad:
              age = r.get("age_h")
              limit = r.get("limit_h")
              age_s = "unknown" if age is None else f"{age:.1f}h"
              lim_s = "—" if limit is None else f"{limit:.0f}h"
              owner = r.get("owner") or "unknown"
              detail = (r.get("detail") or "").strip()
              lines.append(f"| `{r['path']}` | {r.get('status')} | {age_s} | "
                           f"{lim_s} | {owner} |")
              # One annotation per feed: named, aged, and pointed at its owner.
              # A single lumped warning would let a second stale feed hide behind
              # the first.
              print(f"::warning title=Built artifact {r.get('status')}: {r['path']}::"
                    f"{r['path']} is {age_s} old (limit {lim_s}); owner: {owner}."
                    + (f" {detail}" if detail else "")
                    + " Non-blocking — the deploy continues and the page will show"
                      " this feed's real age.")
          if not bad:
              lines.append("Every built artifact is within its freshness budget.")
          lines += ["", "_Non-blocking by design: a stale upstream should not "
                        "withhold the whole site. See the comment on this step._", ""]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          # Surface the real verdict on the step itself. `continue-on-error`
          # below keeps the deploy going while leaving outcome == 'failure', so
          # a stale feed reads as a visible soft-failure in the run UI rather
          # than as an unbroken row of green ticks.
          exit $rc
        continue-on-error: true

      - name: Build LTHCS site indexes (file listing, health summary, pillar history)
        # GitHub Pages cannot list directories, so the LTHCS pages used to
        # discover files by requesting them: pipeline.html walked back day by
        # day with HEAD probes (~285 x 404, ~35 s spinner), /lthcs/health/
        # pulled 30 days of insider/13F/snapshot JSON (~50 MB) to count keys,
        # and the detail modal fetched every snapshot (~48 MB) for 5 lines.
        # This writes data/lthcs/file_index.json, health_summary.json and
        # history/pillars_by_ticker/<T>.json from the committed data so the
        # staging below ships them. Pure transform, no network; not committed
        # (.gitignore). Non-fatal: every page falls back to its old behaviour
        # when these files are missing.
        if: hashFiles('scripts/build_lthcs_site_index.py') != ''
        run: python scripts/build_lthcs_site_index.py --root data/lthcs || echo "[lthcs-index] build failed; pages fall back to probing"
        continue-on-error: true

      - name: Build the API catalog workbook (deploy-time, never committed)
        # /health/'s "Excel (.xlsx)" download. It is derived entirely from the
        # committed health/api_catalog.json and health/catalog_health.json, and it
        # used to be committed weekly by catalog-health.yml. An .xlsx is a zip, so
        # git stored every version whole: 19 versions of ~885 KB were 11% of all
        # repo history. Built here before staging so `cp -R health/*` publishes it.
        # Non-fatal: /health/ deploys regardless, and a failure is annotated.
        run: |
          pip install -q openpyxl==3.1.5
          python scripts/build_catalog_xlsx.py \
            || echo "::warning title=API catalog workbook not built::build_catalog_xlsx.py failed; /health/api-catalog.xlsx is missing from this deploy"
        continue-on-error: true

      - name: Stage site directory
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          # Sidecar payloads (data-<key>.json) are lazy-loaded by the page on
          # tab-select to keep the initial HTML under ~3.5MB. They're written
          # to the repo root by app.py alongside dashboard.html; copy whatever
          # is there so a new SIDECAR_KEYS entry doesn't need a workflow edit.
          # Glob runs in nullglob so an empty match doesn't error.
          shopt -s nullglob
          for f in data-*.json; do
            cp "$f" "_site/$f"
          done
          # Stage the V2 build under /v2/ when present. Missing v2/dashboard.html
          # means the V2 step skipped or failed — production at `/` is unaffected.
          if [ -f v2/dashboard.html ]; then
            mkdir -p _site/v2
            cp v2/dashboard.html _site/v2/index.html
            for f in v2/data-*.json; do
              cp "$f" "_site/v2/$(basename "$f")"
            done
          fi
          # UAP/MUFON sidecar is generated only under v2/ (v2/app.py owns the
          # network fetch). Serve it at the V1 root as well so the V1 UAP tab
          # doesn't 404 if the V2 *page* build fails — this runs independently
          # of the v2/dashboard.html gate above and only needs the JSON to
          # exist. V1's manifest points at the root "data-mufon.json".
          if [ -f v2/data-mufon.json ]; then
            cp v2/data-mufon.json _site/data-mufon.json
          fi
          # Stock-prices sparkline sidecar is written by fetch_stock_prices to
          # v2/data-stock-prices.json (ROOT = the v2/ dir in v2/app.py). The
          # V2 page fetches it relative to its own URL, so _site/v2/... is
          # already produced by the `for f in v2/data-*.json` glob inside the
          # v2/dashboard.html gate above. Also serve a root copy here — like
          # data-mufon.json — so it's published independently of whether the V2
          # *page* HTML built, mirroring the mufon resilience pattern.
          if [ -f v2/data-stock-prices.json ]; then
            cp v2/data-stock-prices.json _site/data-stock-prices.json
          fi
          # Stage LTHCS: the card view at /lthcs/, the subpages at /lthcs/<page>/
          # and the data they read, published ONCE at /data/lthcs/. This used to
          # copy all of data/lthcs (540+ MB) to /data/lthcs/ AND /lthcs/data/lthcs/,
          # which put the site over GitHub Pages' 1 GB limit. The script holds the
          # page list, the data allow-list traced from the page sources (dated
          # directories the pages read only for the newest day are published for
          # the newest 7 days), and the one-extra-'../' rewrite the subpages need
          # because they sit a level deeper here than in the repo. Every file
          # stays in the repository; this only decides what the site publishes.
          python scripts/stage_lthcs_site.py --repo . --site _site
          # Stage the US Real Estate Markets page under /real-estate/. Source
          # at real_estate/index.html (self-contained — inline CSS/JS, Chart.js
          # via CDN with SRI). Reads data from /data/real_estate.json built by
          # the daily real-estate-daily.yml workflow and committed back to the
          # repo. V1 (`/`), V2 (`/v2/`), /health/, and all /lthcs/* paths are
          # untouched. Missing real_estate/index.html or the data JSON makes
          # this branch a no-op; the rest of the site is unaffected.
          if [ -f real_estate/index.html ]; then
            mkdir -p _site/real-estate
            cp -R real_estate/* _site/real-estate/
            if [ -f data/real_estate.json ]; then
              mkdir -p _site/data
              cp data/real_estate.json _site/data/real_estate.json
            fi
            # Heat-map needs metro centroid coords (Census CBSA gazetteer).
            # Static reference data — refreshed manually when Census publishes
            # a new annual gazetteer.
            if [ -f data/metro_coords.json ]; then
              mkdir -p _site/data
              cp data/metro_coords.json _site/data/metro_coords.json
            fi
          fi
          # Stage the central dashboard health observability page under /health/.
          # Source lives at health/index.html (self-contained — no external CSS
          # or JS) and reads its data from /data/health/status.json. Both are
          # produced by the "Build dashboard health status JSON" step above.
          # V1 (`/`), V2 (`/v2/`), and all /lthcs/* paths are untouched —
          # /health/ is a sibling route. Missing health/index.html or the
          # status JSON makes this branch a no-op; the rest of the site is
          # unaffected.
          if [ -f health/index.html ]; then
            mkdir -p _site/health
            cp -R health/* _site/health/
            if [ -f data/health/status.json ]; then
              mkdir -p _site/data/health
              cp data/health/status.json _site/data/health/status.json
            fi
            # Publish the live-API-status snapshot too, so /health/apis.html has
            # a real file to fall back on (no live server on the static mirror).
            # Guarded by -f since the probe step is continue-on-error.
            if [ -f data/health/api_status.json ]; then
              mkdir -p _site/data/health
              cp data/health/api_status.json _site/data/health/api_status.json
            fi
          fi
          # Stage the Snowflake Summit partner-scouting dashboard under /summit/.
          # The page at snowflake_summit/dashboard.html is fully self-contained
          # (Chart.js is vendored inline, data is baked in at build time), so it
          # needs no sidecar JSON or network at view time. We also serve the
          # source workbook next to it for the in-page download button. V1 (`/`),
          # V2 (`/v2/`), /lthcs/*, and /health/ are all untouched — /summit/ is a
          # sibling route. Missing dashboard.html makes this a no-op.
          if [ -f snowflake_summit/dashboard.html ]; then
            mkdir -p _site/summit
            cp snowflake_summit/dashboard.html _site/summit/index.html
            if [ -f snowflake_summit/Snowflake_Summit_2026_Master_Partner_Scouting.xlsx ]; then
              cp snowflake_summit/Snowflake_Summit_2026_Master_Partner_Scouting.xlsx _site/summit/
            fi
          fi
          # Standalone "share" copy of the Summit dashboard at /summit-share/: the
          # build emits dashboard_standalone.html (identical, minus the "← Back to
          # dashboard" escape link). Paired with /landscape/ it forms a sealed,
          # shareable Landscape⇄Summit cluster that exposes no other dashboard.
          # /summit/ (linked from the main dashboard) is untouched.
          if [ -f snowflake_summit/dashboard_standalone.html ]; then
            mkdir -p _site/summit-share
            cp snowflake_summit/dashboard_standalone.html _site/summit-share/index.html
            if [ -f snowflake_summit/Snowflake_Summit_2026_Master_Partner_Scouting.xlsx ]; then
              cp snowflake_summit/Snowflake_Summit_2026_Master_Partner_Scouting.xlsx _site/summit-share/
            fi
          fi
          # Stage the Competitive Landscape dashboard under /landscape/. Like
          # /summit/, the page is fully self-contained (Chart.js inline, data baked
          # in at build time). It reads the committed Summit vendors.json read-only,
          # so Summit's files are unchanged. V1 (`/`), V2 (`/v2/`), /summit/,
          # /lthcs/*, and /health/ are all untouched — /landscape/ is a sibling route.
          if [ -f landscape/dashboard.html ]; then
            mkdir -p _site/landscape
            cp landscape/dashboard.html _site/landscape/index.html
            # PWA bits for "Add to Home Screen": manifest + icons sit next to the
            # page (relative hrefs in <head>), so stage them into the same dir.
            if [ -f landscape/manifest.webmanifest ]; then
              cp landscape/manifest.webmanifest _site/landscape/
            fi
            if [ -d landscape/icons ]; then
              cp -R landscape/icons _site/landscape/
            fi
          fi
          # Publish the newest daily audit report at /audit/latest.md and
          # /audit/latest.json. daily-audit.yml commits it to audit/daily/ once
          # a day; this just mirrors the committed copy, so a missing report
          # (before the first audit run) makes this a no-op.
          # Explicit names, not a glob: this step runs with `shopt -s nullglob`
          # (set above), so an unmatched `latest.*` expands to nothing, `ls`
          # with no arguments succeeds, and `cp` then fails with no source.
          for f in audit/daily/latest.md audit/daily/latest.json; do
            if [ -f "$f" ]; then
              mkdir -p _site/audit
              cp "$f" _site/audit/
            fi
          done
          # Site-wide 404 page (GitHub Pages serves _site/404.html for any
          # missing path). Dark, mobile-friendly, absolute links home.
          if [ -f site_static/404.html ]; then
            cp site_static/404.html _site/404.html
          fi
          # Include a tiny "about" so the page works even if dashboard.html breaks
          cat > _site/README.txt <<EOF
          BDT Dashboards — static snapshot
          Source: https://github.com/btabiado/alpine-data
          Generated: $(date -u)
          EOF

      - name: Publish GitHub status JSON (/health/github_status.json)
        # Workflow runs (+ derived failing / not-running flags and failed-run
        # annotations), open PRs on alpine-data and adw-site, open issues, and
        # code-scanning / Dependabot alert counts, read with this run's token
        # and published next to /health/. The daily audit agent can fetch the
        # site but not the GitHub API, so this is its view of GitHub.
        # Written straight into _site/health/ (after the stage step's
        # `cp -R health/*`, so nothing has to be mirrored afterwards).
        # Observability only: a failing API section is recorded as
        # "unavailable" inside the file, and a crash here must never block the
        # deploy -- `|| echo` plus continue-on-error, as for /health/ above.
        # Budget: <= 100 API calls (~50 in practice) against GITHUB_TOKEN's
        # 1000/h. adw-site is private, so its PRs read as unavailable unless
        # the optional ADW_SITE_TOKEN secret (read-only, adw-site) is set.
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADW_SITE_TOKEN: ${{ secrets.ADW_SITE_TOKEN }}
        run: >-
          python scripts/publish_github_status.py --out _site/health/github_status.json
          || echo "::warning title=GitHub status not published::publish_github_status.py failed; /health/github_status.json is missing from this deploy"
        continue-on-error: true

      - name: Upload daily snapshot to ADW R2 archive
        # Archives all data-*.json sidecars to ADW R2 warehouse for future
        # ClickHouse ingestion (Phase 2.5). Key pattern:
        #   raw/alpine-data/{YYYY-MM-DD}/{rel_path}
        # Runs AFTER data-*.json files are final, BEFORE gh-pages deploy.
        # continue-on-error: true — R2 outages must NEVER break the dashboard.
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          pip install -q boto3
          python upload_to_r2.py
        continue-on-error: true

      - name: Build R2 coverage dashboard
        # Scans R2 bucket, generates health/r2-coverage.json for the heatmap
        # at /health/r2-coverage.html. Runs RIGHT AFTER the upload so today's
        # snapshot is reflected. continue-on-error: true — never breaks build.
        # CRITICAL: must mirror into _site/health/ because the earlier
        # `cp -R health/* _site/health/` step happened BEFORE this script ran.
        # Otherwise the FRESH JSON lives in health/ but the SHIPPED JSON in
        # _site/health/ stays stale → dashboard shows empty state (the bug
        # that hid the heatmap on first deploy 2026-06-23).
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # build_backfill_jobs.py queries the r2-backfill workflow run history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 health/build_r2_coverage.py
          python3 health/build_backfill_jobs.py
          mkdir -p _site/health
          # Mirror BOTH generated JSONs into the deploy artifact — the earlier
          # `cp -R health/*` step ran before these scripts, so the fresh output
          # must be copied again or the live site serves stale/empty data.
          [ -f health/r2-coverage.json ] && cp health/r2-coverage.json _site/health/r2-coverage.json
          [ -f health/r2-backfill-jobs.json ] && cp health/r2-backfill-jobs.json _site/health/r2-backfill-jobs.json
          echo "[coverage] mirrored coverage + jobs JSON → _site/health/"
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
