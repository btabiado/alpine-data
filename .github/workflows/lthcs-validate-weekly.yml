name: lthcs-validate-weekly

# Weekly read-only audit of the LTHCS backfill / snapshot history.
# Runs scripts/lthcs_backfill_validate.py and surfaces failures via a
# non-zero exit, ::error annotations + a job summary (one per failing check),
# and an uploaded JSON artifact. Does NOT commit anything —
# this is pure observability, not data mutation.
#
# Scheduled 1 hour after the weekly trends run so the two don't fight
# for runner pool or git refs.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

# Read-only: no push back to main, so we explicitly request `contents: read`
# instead of `contents: write` to minimize blast radius if the runner
# is ever compromised.
permissions:
  contents: read

concurrency:
  group: lthcs-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest becomes 26.04 on 2026-10-19 and setup-python needs a toolcache build for the image
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backfill validator
        # The validator exits:
        #   0 = clean
        #   1 = warnings only
        #   2 = at least one hard failure
        # We capture the exit code so we can both upload the artifact
        # AND fail the workflow visibly when it's non-zero. Without
        # `continue-on-error: true` the upload step would be skipped.
        #
        # --github: one ::error annotation per failing check (trimmed) and a
        # per-check table in the job summary, so a red run says WHAT failed
        # on the run page; job logs are not readable from everywhere the
        # run is triaged (the daily audit only sees annotations).
        id: validate
        continue-on-error: true
        run: |
          set +e
          python scripts/lthcs_backfill_validate.py --github 2> "$RUNNER_TEMP/validate.stderr"
          code=$?
          cat "$RUNNER_TEMP/validate.stderr" >&2
          # A Python crash also exits 1, the "warnings only" code; say which.
          if grep -q '^Traceback' "$RUNNER_TEMP/validate.stderr"; then
            echo "crashed=true" >> "$GITHUB_OUTPUT"
            echo "::error title=lthcs-validate crashed::$(tail -n 1 "$RUNNER_TEMP/validate.stderr" | cut -c1-400)"
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload validation JSON report
        # Always upload — even on success — so the artifact history in
        # the Actions UI shows a baseline of "what clean looks like."
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lthcs-backfill-validation-${{ github.run_id }}
          # The validator writes data/lthcs/backfill_validation_*.json
          # with a UTC timestamp suffix; glob picks up whichever ran.
          path: data/lthcs/backfill_validation_*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Fail workflow if validation reported issues
        # Mirror the validator's exit code so the workflow status in
        # GitHub reflects whether the audit passed. `1` = warnings,
        # `2` = hard failures; either should turn the run red.
        if: steps.validate.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.validate.outputs.exit_code }}
          CRASHED: ${{ steps.validate.outputs.crashed }}
        run: |
          case "$EXIT_CODE" in
            2) why="hard failures" ;;
            1) why="warnings only" ;;
            *) why="unexpected exit code" ;;
          esac
          where="Each failing check has its own annotation and a row in the job summary; the full list is in the lthcs-backfill-validation artifact."
          if [ "$CRASHED" = "true" ]; then
            why="the validator crashed"
            where="No checks were reported; the traceback is in the 'Run backfill validator' step log."
          fi
          echo "::error title=lthcs-validate-weekly::Validator exited $EXIT_CODE: $why. $where"
          exit "$EXIT_CODE"
