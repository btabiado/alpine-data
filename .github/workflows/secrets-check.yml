name: secrets-check

# Answers one question that is otherwise unanswerable: which API keys does
# Actions ACTUALLY receive?
#
# GitHub secrets are write-only. Nobody — not the UI, not a script, not a
# person — can read a secret's value back, so "I definitely set that key" and
# "the build log shows it empty" can both be true and there is no way to tell
# which store it landed in. This workflow maps every key the repo uses into
# env and reports set/MISSING per key.
#
# It NEVER prints a value; scripts/check_secrets_present.py emits only a
# boolean and a character count. Do not add echo statements here.
#
# THE USUAL CULPRIT: GitHub has several near-identical secret stores.
#   * Repository secrets   - the only store every job in this repo can read
#   * Environment secrets  - visible ONLY to a job declaring `environment:`.
#                            In this repo that is pages.yml's DEPLOY job alone,
#                            and it fetches nothing, so a key parked there
#                            never reaches a fetcher.
#   * Dependabot / Codespaces tabs - separate stores; Actions cannot see them.
#   * Organization secrets not shared with this repo.
# This job deliberately declares NO `environment:`, so it sees exactly what
# city-daily.yml and pages.yml's build job see.

on:
  schedule:
    # Weekly, Mondays 15:05 UTC — five minutes after data-health.yml's daily
    # 15:00 run, so a key that expires or gets rotated out is reported right
    # next to the feed that went stale because of it, rather than surfacing
    # months later as a mystery empty feed.
    - cron: "5 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secrets-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # NO `environment:` on purpose — see the header note.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Report which API keys reach Actions
        env:
          SOCRATA_APP_TOKEN:     ${{ secrets.SOCRATA_APP_TOKEN }}
          CENSUS_API_KEY:        ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY:           ${{ secrets.BLS_API_KEY }}
          FBI_CDE_API_KEY:       ${{ secrets.FBI_CDE_API_KEY }}
          AIRNOW_API_KEY:        ${{ secrets.AIRNOW_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          # Added to check_secrets_present.KEYS in #29 but NOT mapped here, so
          # the audit reported it MISSING regardless of whether the secret
          # existed -- a false negative in the one tool that exists to answer
          # "is this key actually reaching Actions?". Exactly the
          # supplied-but-unread / checked-but-unsupplied split this workflow
          # was built to expose, reintroduced by the change that added the row.
          COINGECKO_API_KEY:     ${{ secrets.COINGECKO_API_KEY }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          GLASSNODE_API_KEY:     ${{ secrets.GLASSNODE_API_KEY }}
          COINMETRICS_API_KEY:   ${{ secrets.COINMETRICS_API_KEY }}
          ETHERSCAN_API_KEY:     ${{ secrets.ETHERSCAN_API_KEY }}
          # RETIRED keys, mapped here ON PURPOSE. They reach no code: CoinGlass
          # was an ETF-flow fallback the keyless Farside mirror superseded, and
          # api.sosovalue.com no longer resolves. Dropping them from this block
          # would make the report silent about them, and silence is what lets a
          # user keep rotating a secret that does nothing for years. Mapped, so
          # the report can say "set, but RETIRED — safe to delete".
          # scripts/check_secrets_present.py labels them "(retired…)", and
          # test_secret_workflow_annotations_match_reality enforces that no
          # OTHER workflow may reference them while that label stands.
          COINGLASS_API_KEY:     ${{ secrets.COINGLASS_API_KEY }}
          SOSOVALUE_API_KEY:     ${{ secrets.SOSOVALUE_API_KEY }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          # Ten keys the fetchers and workflows genuinely reference that this
          # audit was not mapping. An unmapped key reads as MISSING here whether
          # or not it is actually set, so leaving them out did not merely skip
          # them — it guaranteed a wrong answer the day anyone looked.
          #
          # Values are never printed: check_secrets_present.py emits presence
          # and a character count only, and this block adds no echo.
          #
          # COINGECKO_API_KEY is now RETIRED too, and mapped for the same reason
          # as the two above. lthcs-crypto-daily.yml used to pass it, but an
          # audit found nothing in the crypto pipeline reads any API-key env var
          # — crypto_data.py calls CoinGecko keyless — so the mapping was
          # removed there rather than left looking functional.
          COINGECKO_API_KEY:     ${{ secrets.COINGECKO_API_KEY }}
          REDDIT_CLIENT_ID:      ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:  ${{ secrets.REDDIT_CLIENT_SECRET }}
          OPENSKY_CLIENT_ID:     ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          # pages.yml and r2-backfill.yml hand these to boto3 as AWS_* because
          # R2 speaks the S3 API. Mapped here under their SECRET names so the
          # report names the thing you would actually go set in the UI.
          R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:        ${{ secrets.R2_BUCKET_NAME }}
          SEC_USER_AGENT:        ${{ secrets.SEC_USER_AGENT }}
          SECURITY_AUDIT_TOKEN:  ${{ secrets.SECURITY_AUDIT_TOKEN }}
        run: python scripts/check_secrets_present.py
