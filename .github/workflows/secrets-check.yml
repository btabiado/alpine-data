name: secrets-check

# Answers one question that is otherwise unanswerable: which API keys does
# Actions ACTUALLY receive?
#
# GitHub secrets are write-only. Nobody — not the UI, not a script, not a
# person — can read a secret's value back, so "I definitely set that key" and
# "the build log shows it empty" can both be true and there is no way to tell
# which store it landed in. This workflow maps every key the repo uses into
# env and reports set/MISSING per key.
#
# It NEVER prints a value; scripts/check_secrets_present.py emits only a
# boolean and a character count. Do not add echo statements here.
#
# THE USUAL CULPRIT: GitHub has several near-identical secret stores.
#   * Repository secrets   - the only store every job in this repo can read
#   * Environment secrets  - visible ONLY to a job declaring `environment:`.
#                            In this repo that is pages.yml's DEPLOY job alone,
#                            and it fetches nothing, so a key parked there
#                            never reaches a fetcher.
#   * Dependabot / Codespaces tabs - separate stores; Actions cannot see them.
#   * Organization secrets not shared with this repo.
# This job deliberately declares NO `environment:`, so it sees exactly what
# city-daily.yml and pages.yml's build job see.

on:
  schedule:
    # Weekly, Mondays 15:05 UTC — just after the daily freshness check, so a
    # key that expires or gets rotated out shows up within the week rather
    # than as a mystery empty feed months later.
    - cron: "5 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secrets-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # NO `environment:` on purpose — see the header note.
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Report which API keys reach Actions
        env:
          SOCRATA_APP_TOKEN:     ${{ secrets.SOCRATA_APP_TOKEN }}
          CENSUS_API_KEY:        ${{ secrets.CENSUS_API_KEY }}
          BLS_API_KEY:           ${{ secrets.BLS_API_KEY }}
          FBI_CDE_API_KEY:       ${{ secrets.FBI_CDE_API_KEY }}
          AIRNOW_API_KEY:        ${{ secrets.AIRNOW_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          GLASSNODE_API_KEY:     ${{ secrets.GLASSNODE_API_KEY }}
          COINMETRICS_API_KEY:   ${{ secrets.COINMETRICS_API_KEY }}
          ETHERSCAN_API_KEY:     ${{ secrets.ETHERSCAN_API_KEY }}
          COINGLASS_API_KEY:     ${{ secrets.COINGLASS_API_KEY }}
          SOSOVALUE_API_KEY:     ${{ secrets.SOSOVALUE_API_KEY }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY:       ${{ secrets.FINNHUB_API_KEY }}
          R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
        run: python scripts/check_secrets_present.py
